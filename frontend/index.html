<!doctype html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00f2fe" />
    <meta name="description" content="Campus Sentinel - Agentic AI-Powered Smart Campus Emergency Early-Warning & Autonomous Evacuation System" />
    <link rel="manifest" href="/manifest.json" />
    <title>Campus Sentinel | Agentic AI Smart Campus Emergency & Autonomous Evacuation System</title>
  </head>
  <body class="bg-[#07090e] text-slate-100 antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('[PWA] ServiceWorker registered with scope:', registration.scope);
          }).catch((err) => {
            console.log('[PWA] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
