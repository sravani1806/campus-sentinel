services:
  # 1. AI Routing Service (FastAPI)
  - type: web
    name: sentinel-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000

  # 2. Node.js Backend Real-Time Gateway
  - type: web
    name: sentinel-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: sentinel-ai-service
          property: host

  # 3. React Frontend Dashboard
  - type: web
    name: sentinel-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: sentinel-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
